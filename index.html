<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random DSA Problem Generator</title>
    <meta name="description" content="A random generator for easy DSA problems.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="stats">
            <span>Problems Solved / Refreshed: <span id="refresh-count">0</span></span>
        </div>
        <h1>DSA Problem Generator</h1>
        <p>Click the button to reveal a random coding problem to solve!</p>
        
        <div class="card">
            <div id="problem-display" class="problem-display">
                <div id="concept-text" class="concept-text hidden">
                    <p class="problem-desc" id="problem-desc">Click reveal for your next trivia question!</p>
                    <div class="problem-io">
                        <div class="io-block">
                            <strong>Input:</strong> <span id="problem-input"></span>
                        </div>
                        <div class="io-block">
                            <strong>Output:</strong> <span id="problem-output"></span>
                        </div>
                    </div>
                </div>
            </div>
            <button id="reveal-btn" class="reveal-btn">Reveal Problem</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
